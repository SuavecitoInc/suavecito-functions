query RunInput {
  cart {
    cost {
      subtotalAmount {
        amount
      }
      totalAmount {
        amount
      }
      totalDutyAmount {
        amount
      }
      totalTaxAmount {
        amount
      }
    }
    lines {
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        totalAmount {
          amount
          currencyCode
        }
        subtotalAmount {
          amount
          currencyCode
        }
      }
      sellingPlanAllocation {
        sellingPlan {
          id
          name
        }
      }
      merchandise {
        ... on ProductVariant {
          freeShippingExclusions: metafield(
            namespace: "suavecito_function"
            key: "free_shipping_country_exclusions"
          ) {
            value
            jsonValue
          }
        }
      }
    }
    deliveryGroups {
      deliveryAddress {
        provinceCode
        countryCode
        market {
          handle
        }
      }
      deliveryOptions {
        handle
        title
        cost {
          amount
        }
      }
    }
  }
  discountNode {
    metafield(
      namespace: "$app:shipping-discount"
      key: "function-configuration"
    ) {
      value
    }
  }
}
